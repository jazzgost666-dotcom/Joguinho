<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desgraça Kart 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        * { box-sizing: border-box; user-select: none; font-family: 'Fredoka', cursive, sans-serif; }
        body { margin: 0; padding: 0; background: #080511; color: #fff; overflow: hidden; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }

        #app { position: relative; width: 100%; height: 100%; max-width: 1280px; max-height: 720px; background: #120c24; border-radius: 20px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.9); border: 3px solid #ff7675; }

        .screen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at center, #1e133c 0%, #080511 100%); padding: 40px; z-index: 10; }
        .hidden { display: none !important; }

        h1 { font-size: 64px; color: #ff7675; text-transform: uppercase; text-shadow: 0 5px 20px rgba(255,118,117,0.5); margin-bottom: 10px; }
        p { color: #b2bec3; font-size: 18px; margin-bottom: 30px; }

        .btn { background: linear-gradient(180deg, #ff7675 0%, #d63031 100%); border: none; border-bottom: 6px solid #9e1c1d; padding: 16px 36px; color: #fff; font-size: 20px; font-weight: 700; border-radius: 18px; cursor: pointer; box-shadow: 0 10px 25px rgba(214,48,49,0.5); transition: all 0.1s; }
        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .btn:active { transform: translateY(3px); border-bottom-width: 2px; }

        input[type="text"] { background: #1a1233; border: 3px solid #ff7675; padding: 16px 24px; color: #fff; font-size: 20px; font-weight: 700; border-radius: 16px; outline: none; text-align: center; width: 320px; margin-bottom: 20px; }

        /* HUD DO JOGO */
        #hud { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 25px; z-index: 5; }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .hud-panel { background: rgba(18, 12, 36, 0.85); border: 2px solid #ff7675; padding: 14px 24px; border-radius: 16px; font-size: 20px; font-weight: 700; color: #ffeaa7; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
        
        #minimap-container { width: 160px; height: 160px; background: rgba(18, 12, 36, 0.9); border: 3px solid #ff7675; border-radius: 50%; overflow: hidden; position: relative; }
        #minimap-canvas { width: 100%; height: 100%; }

        .hud-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
        #item-box { width: 100px; height: 100px; background: #1a1233; border: 4px solid #ffeaa7; border-radius: 22px; display: flex; justify-content: center; align-items: center; font-size: 42px; box-shadow: 0 0 25px rgba(255,234,167,0.5); }
        #speedometer { font-size: 38px; font-weight: 700; color: #ffeaa7; text-shadow: 0 3px 12px rgba(0,0,0,0.9); }

        #countdown-overlay { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-size: 110px; font-weight: 700; color: #ff7675; text-shadow: 0 5px 35px rgba(255,118,117,0.7); background: rgba(0,0,0,0.5); z-index: 8; pointer-events: none; }
        canvas.webgl { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
    </style>
</head>
<body>

<div id="app">
    <canvas class="webgl"></canvas>

    <!-- 1. TELA DE LOGIN -->
    <div id="screen-login" class="screen">
        <h1>🔥 Desgraça Kart 🔥</h1>
        <p>O jogo de corrida sem regras, sem dó e com muito caos!</p>
        <input type="text" id="input-nick" placeholder="Seu Apelido..." maxlength="12" value="Chad">
        <button class="btn" onclick="Game.startMenu()">ENTRAR NA CARNIÇA 🚀</button>
    </div>

    <!-- 2. MENU PRINCIPAL -->
    <div id="screen-menu" class="screen hidden">
        <h1>Desgraça Kart</h1>
        <p>Escolha sua modalidade de sofrimento:</p>
        <div style="display: flex; flex-direction: column; gap: 15px; width: 340px;">
            <button class="btn" onclick="Game.startRace()">🏎️ Jogar contra Bots (Modo Caos)</button>
        </div>
    </div>

    <!-- 3. HUD DA CORRIDA -->
    <div id="hud" class="hidden">
        <div class="hud-top">
            <div class="hud-panel" id="hud-position">Posição: 1º / 4</div>
            <div class="hud-panel" id="hud-lap">Volta: 1 / 3</div>
            <div id="minimap-container"><canvas id="minimap-canvas" width="160" height="160"></canvas></div>
        </div>
        <div class="hud-bottom">
            <div id="item-box">💣</div>
            <div id="speedometer">0 km/h</div>
        </div>
    </div>

    <div id="countdown-overlay" class="hidden">3</div>

    <!-- 4. PÓS-CORRIDA -->
    <div id="screen-podium" class="screen hidden">
        <h1 id="podium-title">🏆 FIM DA CORNIÇA!</h1>
        <p id="podium-stats" style="font-size: 22px; color: #ffeaa7;"></p>
        <button class="btn" onclick="location.reload()">JOGAR DE NOVO</button>
    </div>
</div>

<script>
    const AudioSys = {
        ctx: null,
        init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
        playPop(freq = 400) {
            try {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.12);
            } catch(e){}
        }
    };

    const Game = {
        nick: 'Chad',
        startMenu() {
            let n = document.getElementById('input-nick').value.trim();
            if (n) this.nick = n;
            AudioSys.playPop(500);
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-menu').classList.remove('hidden');
        },
        startRace() {
            AudioSys.playPop(700);
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            World3D.init();
        },
        endRace(rank) {
            World3D.stop();
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('screen-podium').classList.remove('hidden');
            document.getElementById('podium-stats').innerText = `${this.nick} ficou em ${rank}º Lugar!`;
        }
    };

    const World3D = {
        scene: null, camera: null, renderer: null, karts: [], waypoints: [], isRunning: false, keys: {},
        init() {
            const canvas = document.querySelector('.webgl');
            this.scene = new THREE.Scene();
            this.scene.background = new THREE.Color('#0a0614');
            this.scene.fog = new THREE.FogExp2('#0a0614', 0.012);

            this.camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            this.renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            this.renderer.setSize(window.innerWidth > 1280 ? 1280 : window.innerWidth, window.innerHeight > 720 ? 720 : window.innerHeight);

            this.scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            let dir = new THREE.DirectionalLight(0xffffff, 0.8);
            dir.position.set(40, 80, 40);
            this.scene.add(dir);

            this.buildTrack();
            this.spawnKarts();

            this.keys = {};
            window.onkeydown = e => this.keys[e.code] = true;
            window.onkeyup = e => this.keys[e.code] = false;

            this.startCountdown();
        },
        buildTrack() {
            this.waypoints = [];
            for (let i = 0; i < 24; i++) {
                let angle = (i / 24) * Math.PI * 2;
                this.waypoints.push(new THREE.Vector3(Math.cos(angle) * 85, 0, Math.sin(angle) * 65));
            }
            let trackGeo = new THREE.TorusGeometry(75, 14, 16, 80);
            let trackMat = new THREE.MeshStandardMaterial({ color: 0x221a36, roughness: 0.9 });
            let track = new THREE.Mesh(trackGeo, trackMat);
            track.rotation.x = Math.PI / 2;
            this.scene.add(track);
        },
        spawnKarts() {
            this.karts = [];
            let colors = [0xff7675, 0x74b9ff, 0x55efc4, 0xfdcb6e];
            let names = [Game.nick, 'Bot Mau', 'Bot Insano', 'Bot Apelão'];

            for (let i = 0; i < 4; i++) {
                let g = new THREE.Group();
                let b = new THREE.Mesh(new THREE.BoxGeometry(3.8, 1.8, 6.5), new THREE.MeshStandardMaterial({ color: colors[i] }));
                b.position.y = 1;
                g.add(b);
                let h = new THREE.Mesh(new THREE.SphereGeometry(1.2, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffffff }));
                h.position.set(0, 2.6, 0);
                g.add(h);

                let wp = this.waypoints[0];
                g.position.set(wp.x + (i * 3), 0, wp.z + (i * 5));
                this.scene.add(g);

                this.karts.push({ mesh: g, speed: 0, maxSpeed: 0.9, angle: 0, wpIndex: 0, lap: 1, isPlayer: i === 0, name: names[i] });
            }
        },
        startCountdown() {
            let ov = document.getElementById('countdown-overlay');
            ov.classList.remove('hidden');
            let c = 3; ov.innerText = c;
            AudioSys.playPop(400);
            let t = setInterval(() => {
                c--;
                if (c > 0) { ov.innerText = c; AudioSys.playPop(400); }
                else if (c === 0) { ov.innerText = "VALENDO A CARNIÇA! 🔥"; AudioSys.playPop(800); }
                else { clearInterval(t); ov.classList.add('hidden'); this.isRunning = true; this.loop(); }
            }, 1000);
        },
        loop() {
            if (!this.isRunning) return;
            this.update();
            this.renderer.render(this.scene, this.camera);
            requestAnimationFrame(() => this.loop());
        },
        update() {
            let p = this.karts[0];
            if (p) {
                if (this.keys['ArrowUp'] || this.keys['KeyW']) p.speed = Math.min(p.maxSpeed, p.speed + 0.02);
                else if (this.keys['ArrowDown'] || this.keys['KeyS']) p.speed = Math.max(-0.4, p.speed - 0.02);
                else p.speed *= 0.94;

                if (this.keys['ArrowLeft'] || this.keys['KeyA']) p.angle += 0.045 * (p.speed / p.maxSpeed);
                if (this.keys['ArrowRight'] || this.keys['KeyD']) p.angle -= 0.045 * (p.speed / p.maxSpeed);
                p.mesh.rotation.y = p.angle;
                p.mesh.translateZ(p.speed);

                let cp = new THREE.Vector3(p.mesh.position.x - Math.sin(p.angle)*16, p.mesh.position.y + 7, p.mesh.position.z - Math.cos(p.angle)*16);
                this.camera.position.lerp(cp, 0.2);
                this.camera.lookAt(p.mesh.position.clone().add(new THREE.Vector3(0, 1.5, 0)));

                document.getElementById('speedometer').innerText = `${Math.round(p.speed * 150)} km/h`;
            }

            for (let i = 1; i < this.karts.length; i++) {
                let bot = this.karts[i];
                let twp = this.waypoints[bot.wpIndex];
                let dir = new THREE.Vector3().subVectors(twp, bot.mesh.position);
                bot.angle = Math.atan2(dir.x, dir.z);
                bot.mesh.rotation.y = bot.angle;
                bot.speed = bot.maxSpeed * 0.85;
                bot.mesh.translateZ(bot.speed);

                if (bot.mesh.position.distanceTo(twp) < 25) {
                    bot.wpIndex = (bot.wpIndex + 1) % this.waypoints.length;
                    if (bot.wpIndex === 0) {
                        bot.lap++;
                        if (bot.lap > 3 && this.isRunning) { this.isRunning = false; Game.endRace(i + 1); }
                    }
                }
            }

            let pt = this.waypoints[p.wpIndex];
            if (p.mesh.position.distanceTo(pt) < 30) {
                p.wpIndex = (p.wpIndex + 1) % this.waypoints.length;
                if (p.wpIndex === 0) {
                    p.lap++;
                    document.getElementById('hud-lap').innerText = `Volta: ${p.lap} / 3`;
                    if (p.lap > 3) { this.isRunning = false; Game.endRace(1); }
                }
            }
            this.drawMinimap();
        },
        drawMinimap() {
            let cvs = document.getElementById('minimap-canvas'), ctx = cvs.getContext('2d');
            ctx.clearRect(0, 0, 160, 160);
            ctx.fillStyle = '#120c24'; ctx.fillRect(0, 0, 160, 160);
            ctx.strokeStyle = '#ff7675'; ctx.lineWidth = 12;
            ctx.beginPath(); ctx.arc(80, 80, 52, 0, Math.PI*2); ctx.stroke();

            this.karts.forEach((k, idx) => {
                let mx = 80 + (k.mesh.position.x / 100) * 52;
                let my = 80 + (k.mesh.position.z / 80) * 52;
                ctx.fillStyle = idx === 0 ? '#55efc4' : '#ff7675';
                ctx.beginPath(); ctx.arc(mx, my, idx === 0 ? 5 : 3.5, 0, Math.PI*2); ctx.fill();
            });
        },
        stop() { this.isRunning = false; window.onkeydown = null; window.onkeyup = null; }
    };
</script>

</body>
</html>
